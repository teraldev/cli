                    type: string
                    description: Git commit message
                    example: "feat: add new feature"
                authorHandle:
                    type: string
                    description: Git author handle/username
                    example: "johndoe"
                authorAvatarUrl:
                    type: string
                    description: Git author avatar URL
                    example: "https://avatars.githubusercontent.com/u/123456"
                timestamp:
                    type: integer
                    format: int64
                    description: Commit timestamp in milliseconds
                    example: 1704067200000
        V1DeployCreateDeploymentResponseData:
            type: object
            required:
                - deploymentId
            properties:
                deploymentId:
                    type: string
                    description: Unique deployment identifier
                    example: "d_abc123xyz"
        V1DeployGetDeploymentResponseData:
            type: object
            required:
                - id
                - status
            properties:
                id:
                    type: string
                    description: Unique deployment identifier
                    example: "d_abc123xyz"
                status:
                    type: string
                    description: Current deployment status
                    enum:
                        - UNSPECIFIED
                        - PENDING
                        - STARTING
                        - BUILDING
                        - DEPLOYING
                        - NETWORK
                        - FINALIZING
                        - READY
                        - FAILED
                        - SKIPPED
                        - AWAITING_APPROVAL
                        - STOPPED
                        - SUPERSEDED
                        - CANCELLED
                    example: "READY"
                    x-speakeasy-unknown-values: allow
                errorMessage:
                    type: string
                    description: Error message if deployment failed
