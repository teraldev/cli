    /v1/gateway.setPolicies:
        post:
            description: |
                Replace an environment's gateway policies in a single atomic request.
                Policies run at the edge before requests reach your app: block requests
                outright or log them.

                Policies are an ordered list: the gateway evaluates them top to bottom
                and the first rejection short-circuits the request.

                Each policy sets exactly one of `firewall` or `logging`, plus optional `match` expressions restricting which requests
                it applies to.

                Every call is a full replace: the environment's policies become exactly
                the request list in the given order, and the server generates a fresh id
                for each one. An empty list removes all policies. The operation is
                atomic: if any policy is invalid, nothing is written.

                **Required Permissions**

                Your API key must have one of the following permissions:
                - `environment.*.set_policies` (for any environment)
                - `environment.<environment_id>.set_policies` (for a specific environment)
            operationId: gateway.setPolicies
            requestBody:
                content:
                    application/json:
                        examples:
                            matchers:
                                summary: Block a path prefix with a firewall policy
                                value:
                                    app: payments-api
                                    environment: production
                                    policies:
                                        - enabled: true
                                          firewall:
                                            action: ACTION_DENY
                                          match:
                                            - path:
                                                path:
                                                    prefix: /internal/
                                          name: Block internal paths
                                    project: payments
                            reset:
                                summary: Remove all policies
                                value:
                                    app: payments-api
                                    environment: production
                                    policies: []
                                    project: payments
                        schema:
                            $ref: '#/components/schemas/V1GatewaySetPoliciesRequestBody'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/V1GatewaySetPoliciesResponseBody'
                    description: |
                        Successfully set the policies.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BadRequestErrorResponse'
                    description: Bad request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UnauthorizedErrorResponse'
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ForbiddenErrorResponse'
                    description: Forbidden - Insufficient permissions (requires `environment.*.set_policies`)
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/NotFoundErrorResponse'
                    description: Not Found - The environment does not exist in your workspace
                "429":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/TooManyRequestsErrorResponse'
                    description: Too Many Requests
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InternalServerErrorResponse'
                    description: Internal server error
            security:
                - apiKey: []
            summary: Set policies
            tags:
                - gateway
            x-speakeasy-name-override: setPolicies
    /v1/gateway.updatePolicy:
        post:
            description: |
                Update a single policy in place without resending the environment's full
                policy list. The policy keeps its id and its position in the evaluation
                order, and all other policies are untouched.

                Omitted fields keep their stored values; at least one updatable field
                must be provided. Setting `match` to null removes all match expressions
                so the policy applies to every request. Providing one of `firewall` or
                `logging` replaces the policy's rule
                entirely, including switching its type; at most one may be set.

                Policy ids are regenerated whenever `gateway.setPolicies` replaces the
                list, so fetch current ids via `gateway.listPolicies` first.

                **Required Permissions**

                Your API key must have one of the following permissions:
                - `environment.*.update_policy` (for any environment)
                - `environment.<environment_id>.update_policy` (for a specific environment)
            operationId: gateway.updatePolicy
            requestBody:
                content:
                    application/json:
                        examples:
                            clearMatch:
                                summary: Remove all match expressions
                                value:
                                    app: payments-api
                                    environment: production
                                    match: null
                                    policyId: pol_9d2Fk1LmQ
                                    project: payments
                            disable:
                                summary: Disable a policy without touching its rule
                                value:
                                    app: payments-api
                                    enabled: false
                                    environment: production
                                    policyId: pol_9d2Fk1LmQ
                                    project: payments
                            rename:
                                summary: Rename a policy
                                value:
                                    app: payments-api
                                    environment: production
                                    name: Block internal paths (v2)
                                    policyId: pol_9d2Fk1LmQ
                                    project: payments
                            switchRule:
                                summary: Replace the policy's rule with a firewall deny
                                value:
                                    app: payments-api
                                    environment: production
                                    firewall:
                                        action: ACTION_DENY
                                    policyId: pol_9d2Fk1LmQ
                                    project: payments
                        schema:
                            $ref: '#/components/schemas/V1GatewayUpdatePolicyRequestBody'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/V1GatewayUpdatePolicyResponseBody'
                    description: |
                        Successfully updated the policy.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BadRequestErrorResponse'
                    description: Bad request
                "401":
                    content:
                        application/json:
                            schema:
