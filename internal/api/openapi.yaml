                steps:
                    type: array
                    items:
                        $ref: "#/components/schemas/V1DeployDeploymentStep"
                    description: Deployment steps with status and messages
        V1DeployDeploymentStep:
            type: object
            properties:
                status:
                    type: string
                    description: Step status
                    example: "completed"
                message:
                    type: string
                    description: Step message
                    example: "Image pulled successfully"
                errorMessage:
                    type: string
                    description: Error message if step failed
                    example: "Connection timeout"
                createdAt:
                    type: integer
                    format: int64
                    description: Unix timestamp in milliseconds
                    example: 1704067200000
        DeploymentSourceGit:
            type: object
            properties:
                branch:
                    type: string
                    maxLength: 256
                    description: Branch to build (its HEAD). Omit branch and commitSha to use the app's default branch.
                    example: "main"
                commitSha:
                    type: string
                    maxLength: 40
                    description: Commit to build (full or abbreviated SHA). Takes precedence over branch.
                    example: "9f2c1a7"
                repository:
                    type: string
                    pattern: "^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$"
                    maxLength: 256
                    description: Build from a fork instead of the app's connected repository, as "owner/repo". Requires commitSha.
                    example: "contributor/acme-api"
            description: Build from the app's connected GitHub repository.
        DeploymentSourceImage:
            type: object
            required:
                - dockerImage
            properties:
                dockerImage:
                    type: string
                    deprecated: true
                    minLength: 1
                    maxLength: 256
                    pattern: "\\S"
                    description: >-
                        Deprecated. Use `oci.image` in v3 instead. This field is the full image reference to deploy as-is. Qualify the version with a tag (ghcr.io/acme/api:v1.2.3) or a digest (ghcr.io/acme/api@sha256:...). Without either, the registry serves the latest tag.
                    example: "ghcr.io/acme/api:v1.2.3"
            description: Deploy a prebuilt Docker image as-is.
        DeploymentSourceDeployment:
            type: object
            required:
                - deploymentId
            properties:
                deploymentId:
                    "$ref": "#/components/schemas/ResourceIdentifier"
            description: Re-run an existing deployment.
        DeploymentSourceUpload:
            type: object
            required:
                - uploadId
            properties:
                uploadId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    description: Upload created with `deployments.createUpload` whose archive was uploaded.
                    example: upl_4fQm9XkV2u8sJ1wZ
                configFile:
                    type: string
                    maxLength: 65536
                    description: |
                        Contents of the app's `teral.toml`, when the uploaded directory has one.
                        It is applied exactly like the file in a git deployment.
                git:
                    type: object
                    description: |
                        Git metadata of the local checkout the archive was made from, shown on
                        the deployment. Recorded as given; nothing is fetched.
                    properties:
                        branch:
                            type: string
                            maxLength: 256
                            example: main
                        commitSha:
                            type: string
                            maxLength: 40
                            example: 9f2c1a7e4b5d6c8a0f1e2d3c4b5a69788766554
                        commitMessage:
                            type: string
                            maxLength: 1024
                            example: "fix: handle empty carts"
                        dirty:
                            type: boolean
                            description: True when the archive includes uncommitted changes.
                    additionalProperties: false
            additionalProperties: false
            description: Build a source archive uploaded with `deployments.createUpload`, as `teral up` does.
        V1DeploymentsCreateDeploymentResponseData:
            type: object
            required:
                - deploymentId
            properties:
                deploymentId:
                    type: string
                    description: Unique deployment identifier. Poll deployments.getDeployment with this id to watch status.
                    example: "d_abc123xyz"
        V1DeploymentsCreateUploadResponseData:
            type: object
            required:
                - uploadId
                - uploadUrl
                - method
                - headers
                - expiresAt
                - maxSizeBytes
            properties:
                uploadId:
                    type: string
                    description: Pass as `upload.uploadId` to `deployments.createDeployment`.
                    example: upl_4fQm9XkV2u8sJ1wZ
                uploadUrl:
                    type: string
                    description: Pre-signed URL to upload the archive to.
                method:
                    type: string
                    enum:
                        - PUT
                headers:
                    type: object
                    additionalProperties:
                        type: string
                    description: Headers the upload request must send.
                expiresAt:
                    type: integer
                    format: int64
                    description: Unix milliseconds after which `uploadUrl` stops accepting the upload.
                maxSizeBytes:
                    type: integer
                    format: int64
                    description: Largest archive the upload accepts.
                    example: 524288000
            additionalProperties: false
        Deployment:
            type: object
            required:
                - id
                - status
                - isCurrent
                - environment
                - app
                - project
                - availableActions
                - regions
                - runtime
                - createdAt
            properties:
                id:
                    type: string
                    description: |
                        The unique identifier of the deployment, generated by Teral.
                    example: d_1234abcd
                status:
                    "$ref": "#/components/schemas/DeploymentStatus"
                isCurrent:
                    type: boolean
                    description: |
                        True when this is the production deployment currently serving traffic, i.e.
                        on api.acme.com. Only production deployments can be current, and at most one
                        deployment is current. Rollbacks and promotions change which deployment is
                        current and serves requests to api.acme.com.
                    example: true
                environment:
                    type: string
                    description: Slug of the environment this deployment belongs to.
                    example: production
                app:
                    type: string
                    description: Slug of the app this deployment belongs to.
                    example: payments-api
                project:
                    type: string
                    description: Slug of the project this deployment belongs to.
                    example: acme
                git:
                    "$ref": "#/components/schemas/DeploymentGit"
                    description: |
                        Present for git-sourced deployments. Mutually exclusive with `docker`.
                upload:
                    "$ref": "#/components/schemas/DeploymentUpload"
                    description: |
                        Present for deployments built from a source archive uploaded by the CLI.
                docker:
                    "$ref": "#/components/schemas/DeploymentDocker"
                    description: |
                        Compatibility field present for OCI image-sourced deployments. Mutually exclusive with `git`.
                availableActions:
                    type: array
                    items:
                        "$ref": "#/components/schemas/DeploymentAction"
                    description: |
                        Lifecycle operations you are allowed to call on this deployment right now.
                        Empty when none apply (e.g. while building or in a terminal state).
                    example: ["stop"]
                regions:
                    type: array
                    items:
                        type: string
                    description: |
                        Regions this deployment is configured to run in. Empty while the deployment
                        has no scheduled regions yet.
                    example: ["us-east-1", "eu-west-1"]
                error:
                    "$ref": "#/components/schemas/DeploymentError"
                    description: |
                        Why the deployment failed. Present only when `status` is `failed`.
                domains:
                    type: array
                    items:
                        type: string
                    description: |
                        Public hostnames this deployment is reachable at.
                    example: ["kebap-app.teral.app"]
                runtime:
                    "$ref": "#/components/schemas/DeploymentRuntime"
                config:
                    "$ref": "#/components/schemas/DeploymentConfig"
                    description: |
                        The `teral.toml` this deployment read from its commit. Omitted when the
                        commit had none, and for image deployments.
                build:
                    "$ref": "#/components/schemas/DeploymentBuild"
                    description: |
                        How the image was built. Present for git deployments created after build
                        settings were recorded.
                createdAt:
                    type: integer
                    format: int64
                    minimum: 0
                    maximum: 9223372036854775807
                    description: |
                        Unix timestamp in milliseconds when the deployment was created.
                    example: 1704067200000
                updatedAt:
                    type: integer
                    format: int64
                    minimum: 0
                    maximum: 9223372036854775807
                    description: |
                        Unix timestamp in milliseconds when the deployment was last updated.
                        Omitted if the deployment has never been updated.
                    example: 1704153600000
                    x-go-type-skip-optional-pointer: true
                    x-go-type-skip-optional-pointer-with-omitzero: true
            additionalProperties: false
        DeploymentStatus:
            type: string
            enum:
                - pending
                - starting
                - building
                - deploying
                - network
                - finalizing
                - ready
                - failed
                - skipped
                - awaiting_approval
                - stopped
                - superseded
                - cancelled
            x-enum-varnames:
                - DeploymentStatusPending
                - DeploymentStatusStarting
                - DeploymentStatusBuilding
                - DeploymentStatusDeploying
                - DeploymentStatusNetwork
                - DeploymentStatusFinalizing
                - DeploymentStatusReady
                - DeploymentStatusFailed
                - DeploymentStatusSkipped
                - DeploymentStatusAwaitingApproval
                - DeploymentStatusStopped
                - DeploymentStatusSuperseded
                - DeploymentStatusCancelled
            description: |
                Current lifecycle status of the deployment. Poll until it reaches a
                terminal state: ready (serving), failed, skipped, superseded, stopped,
                or cancelled.
            example: ready
        DeploymentGit:
            type: object
            required:
                - commitSha
            properties:
                commitSha:
                    type: string
                    description: The git commit SHA this deployment was built from.
                    example: 9f2c1a7d3b
                branch:
                    type: string
                    description: The git branch this deployment was built from. Omitted when unknown.
                    example: main
            additionalProperties: false
        DeploymentUpload:
            type: object
            required:
                - uploadId
            properties:
                uploadId:
                    type: string
                    example: upl_4fQm9XkV2u8sJ1wZ
                dirty:
                    type: boolean
                    description: True when the archive included uncommitted changes.
            additionalProperties: false
        DeploymentDocker:
            type: object
            required:
                - image
            properties:
                image:
                    type: string
                    description: The OCI image reference requested for this deployment.
                    example: ghcr.io/acme/api:v1.2.3
            additionalProperties: false
        DeploymentAction:
            type: string
            enum:
                - promote
                - rollback
                - stop
                - start
            x-enum-varnames:
                - DeploymentActionPromote
                - DeploymentActionRollback
                - DeploymentActionStop
                - DeploymentActionStart
            description: |
                A lifecycle operation that can be performed on the deployment in its current
                state, given its status, environment, and whether it is the current
                deployment.
            example: promote
        DeploymentError:
            type: object
            required:
                - code
                - step
                - message
            properties:
                code:
                    "$ref": "#/components/schemas/DeploymentErrorCode"
                step:
                    type: string
                    description: |
                        The pipeline step that failed (e.g. `queued`, `building`, `deploying`).
                    example: deploying
                message:
                    type: string
                    description: |
                        Human-readable description of why the deployment failed. For programmatic
                        handling, use `code`.
                    example: No schedulable regions configured. Please configure at least one schedulable region before deploying.
            additionalProperties: false
        DeploymentRuntime:
            type: object
            required:
                - vCpus
                - memoryMib
                - storageMib
                - port
                - command
                - shutdownSignal
                - upstreamProtocol
            properties:
                vCpus:
                    type: number
                    format: double
                    description: |
                        CPU allocation in vCPUs (1 = one vCPU, 0.5 = half a vCPU).
                    example: 0.25
                memoryMib:
                    type: integer
                    description: |
                        Memory allocation in mebibytes.
                    example: 256
                storageMib:
                    type: integer
                    description: |
                        Ephemeral storage allocation in mebibytes.
                    example: 0
                port:
                    type: integer
                    description: |
                        Port the container listens on.
                    example: 8080
                command:
                    type: array
                    items:
                        type: string
                    description: |
                        Container entrypoint command override. Empty when none is set.
                    example: ["node", "server.js"]
                shutdownSignal:
                    "$ref": "#/components/schemas/EnvironmentShutdownSignal"
                upstreamProtocol:
                    "$ref": "#/components/schemas/EnvironmentUpstreamProtocol"
                healthcheck:
                    "$ref": "#/components/schemas/EnvironmentHealthcheck"
                    description: |
                        HTTP health probe configuration. Omitted when no healthcheck is configured.
            additionalProperties: false
        DeploymentConfig:
            type: object
            description: |
                The `teral.toml` this deployment read from its commit. Its values override the
                environment's settings for this deployment only; `runtime` already shows the
                result.
            required:
                - path
                - blobSha
                - overrides
                - warnings
            properties:
                path:
                    type: string
                    description: Path of the file from the repository root.
                    example: apps/web/teral.toml
                blobSha:
                    type: string
                    description: Git blob SHA of the file. Empty when the file could not be read.
                    example: 3b18e512dba79e4c8300dd08aeb37f8e728b8dad
                overrides:
                    type: array
                    items:
                        "$ref": "#/components/schemas/DeploymentConfigOverride"
                    description: |
                        Every setting the file decided for this deployment's environment. Empty
                        when the file was rejected.
                warnings:
                    type: array
                    items:
                        type: string
                    description: |
                        Problems that did not block the deployment, such as an
                        `[environments.<slug>]` table for an environment the app doesn't have.
                    example: []
                error:
                    type: string
                    description: |
                        Why the file was rejected, one `path:line:column: message` per line. The
                        deployment failed before building. Omitted for a valid file.
                    example: 'teral.toml:4:1: unknown key "prot" in [deploy] (did you mean "port"?)'
            additionalProperties: false
        DeploymentBuild:
            type: object
            description: How a git deployment's image was built, after `teral.toml` was applied.
            required:
                - builder
                - rootDirectory
            properties:
                builder:
                    type: string
                    enum:
                        - dockerfile
                        - railpack
                    x-enum-varnames:
                        - DeploymentBuildBuilderDockerfile
                        - DeploymentBuildBuilderRailpack
                    description: |
                        `dockerfile` builds the Dockerfile; `railpack` detects the language and
                        builds without one.
                    example: dockerfile
                rootDirectory:
                    type: string
                    description: Build context, relative to the repository root.
                    example: apps/web
                dockerfile:
                    type: string
                    description: Dockerfile path relative to `rootDirectory`. Dockerfile builds only.
                    example: Dockerfile
                buildCommand:
                    type: string
                    description: Build command that replaced the detected one. Railpack builds only; omitted when detected.
                    example: pnpm build
            additionalProperties: false
        DeploymentErrorCode:
            type: string
            enum:
                - no_schedulable_regions
                - invalid_runtime_settings
                - cpu_quota_exceeded
                - memory_quota_exceeded
                - storage_quota_exceeded
                - build_failed
                - invalid_config
                - unknown
            x-enum-varnames:
                - DeploymentErrorCodeNoSchedulableRegions
                - DeploymentErrorCodeInvalidRuntimeSettings
                - DeploymentErrorCodeCpuQuotaExceeded
                - DeploymentErrorCodeMemoryQuotaExceeded
                - DeploymentErrorCodeStorageQuotaExceeded
                - DeploymentErrorCodeBuildFailed
                - DeploymentErrorCodeInvalidConfig
                - DeploymentErrorCodeUnknown
            description: |
                The reason a deployment failed. `invalid_config` means the commit's
                `teral.toml` was rejected; see `config.error`. `unknown` means Teral could not classify the
                failure; see `message` for details.
            example: no_schedulable_regions
        EnvironmentShutdownSignal:
            type: string
            enum:
                - SIGTERM
                - SIGINT
                - SIGQUIT
                - SIGKILL
            description: |
                Signal sent to the container on shutdown.
            example: SIGTERM
        EnvironmentUpstreamProtocol:
            type: string
            enum:
                - http1
                - h2c
            description: |
                Protocol used to reach the container.
            example: http1
        EnvironmentHealthcheck:
            type: object
            required:
                - method
                - path
            properties:
                method:
                    type: string
                    enum:
                        - GET
                        - POST
                    description: |
                        HTTP method used to probe the container.
                    example: GET
                path:
                    type: string
                    minLength: 1
                    maxLength: 512
                    pattern: '^(/[\w\-]+)+(\.[\w]+)?$'
                    description: |
                        HTTP path probed on the container. Must start with a slash.
                    example: /healthz
                intervalSeconds:
                    type: integer
                    minimum: 1
                    maximum: 3600
                    description: |
                        How often the probe runs, in seconds. Defaults to 10 when omitted.
                    example: 10
                timeoutSeconds:
                    type: integer
                    minimum: 1
                    maximum: 3600
                    description: |
                        Per-probe timeout, in seconds. Defaults to 5 when omitted.
                    example: 2
                failureThreshold:
                    type: integer
                    minimum: 1
                    maximum: 100
                    description: |
                        Consecutive failures before the container is restarted. Defaults to 3 when omitted.
                    example: 3
                initialDelaySeconds:
                    type: integer
                    minimum: 0
                    maximum: 3600
                    description: |
                        Delay before the first probe runs, in seconds. Defaults to 0 when omitted.
                    example: 5
            additionalProperties: false
        DeploymentConfigOverride:
            type: object
            required:
                - key
                - value
                - fromEnvironment
            properties:
                key:
                    type: string
                    description: |
                        The setting's key in the file, without the environment prefix, e.g.
                        `deploy.port` or `deploy.healthcheck`.
                    example: deploy.port
                value:
                    description: |
                        The value as written in the file: a string, number, boolean, list of
                        strings, or for `deploy.healthcheck` an object of the keys it sets.
                        Durations are strings such as `10s`.
                    example: 3000
                fromEnvironment:
                    type: boolean
                    description: |
                        True when the value comes from the `[environments.<slug>]` table for this
                        deployment's environment rather than the top level.
                    example: false
            additionalProperties: false
        V1DomainsCreateDomainResponseData:
            type: object
            required:
                - domainId
                - dnsRecords
            properties:
                domainId:
                    "$ref": "#/components/schemas/ResourceIdentifier"
                dnsRecords:
                    type: array
                    minItems: 1
                    items:
                        "$ref": "#/components/schemas/DnsRecord"
                    description: |
                        Every DNS record needed to finish setting up this domain, ready to create at your provider.
                        The list already accounts for whether the domain is an apex or a subdomain, so no further
                        branching is needed: create each entry as given.

                        One record establishes routing and one proves ownership. Create all of them: whether ownership
                        can be inferred from the routing record depends on how your provider publishes it, and a name
                        another workspace has already verified can only be claimed through the ownership record.
                        Neither is knowable before the records exist.
                domainConnect:
                    "$ref": "#/components/schemas/DomainConnect"
            additionalProperties: false
        DnsRecord:
            type: object
            required:
                - type
                - name
                - value
                - ttl
                - verified
            properties:
                type:
                    type: string
                    enum:
                        - CNAME
                        - ALIAS
                        - TXT
                    description: |
                        Record type to create. `ALIAS` is not a real DNS record type: it means an apex-compatible
                        alias, which providers expose as ALIAS, ANAME, or a flattened CNAME. Apex domains cannot
                        hold a plain CNAME, so they receive `ALIAS` where a subdomain receives `CNAME`.
                    example: CNAME
                name:
                    type: string
                    minLength: 1
                    maxLength: 253
                    description: |
                        Fully qualified name of the record, ready to use as-is.

                        Some providers want a name relative to the zone instead. Drop the zone and its trailing dot:
                        in zone `acme.com`, `api.acme.com` becomes `api` and `_teral.api.acme.com` becomes
                        `_teral.api`. A name equal to the zone itself is usually entered as `@`.
                    example: api.acme.com
                value:
                    type: string
                    minLength: 1
                    maxLength: 512
                    description: |
                        The value to set on the record, exactly as given, including any prefix.
                        Do not trim or reformat it: verification compares the published record against this string.

                        Use the lowest TTL your provider allows until the domain is verified. Verification polls DNS,
                        so a long TTL keeps a stale value cached and can burn the verification window on a value you
                        have already corrected. Raise it afterwards if you want.
                    example: a1b2c3d4e5f6g7h8.cname.teral.dev
                ttl:
                    type: integer
                    minimum: 1
                    description: |
                        Seconds a resolver may cache this record. Set it in your provider alongside the record's
                        name and value.
                    example: 60
                verified:
                    type: boolean
                    description: |
                        Whether Teral has read this record back with the expected value. Use it to see which
                        records are still outstanding.

                        False does not always mean the record is missing. A provider that does not expose the
                        published value to a DNS lookup, such as a proxied or flattened routing record, leaves
                        this false for as long as it serves traffic; such a domain verifies through its TXT
                        record instead. Always false on a domain no check has run against yet.
                    example: false
                note:
                    type: string
                    maxLength: 512
                    description: |
                        What this record is for and any provider-specific caveat that applies to it.
                        Worth surfacing to whoever edits the DNS zone. Treat it as optional: it carries
                        no data the record itself needs, so a future record type may omit it.
                    example: Create as DNS-only if your provider offers the choice.
            additionalProperties: false
        DomainConnect:
            type: object
            description: |
                One-click setup at the domain's DNS provider. Omitted entirely when the provider does not support
                Domain Connect or discovery failed, so the object's presence is the signal that the shortcut is
                available and both of its fields are filled.
            required:
                - provider
                - url
            properties:
                provider:
                    type: string
                    maxLength: 256
                    description: |
                        Display name of the DNS provider the domain is delegated to, such as 'Cloudflare'. Discovered
                        from the domain's nameservers, so it reflects where DNS is actually hosted rather than where the
                        domain was registered.
                    example: Cloudflare
                url:
                    type: string
                    maxLength: 2048
                    description: |
                        Signed Domain Connect URL that pre-fills the records in `dnsRecords` at the provider. Open it in a
                        browser and the domain owner approves them in one step instead of entering them by hand. The URL is
                        signed with an Teral key, so it cannot be constructed or altered by the caller.

                        Intended for a browser, not a script: after approval the provider sends the browser to this
                        workspace's app settings page in the Teral dashboard, so it suits a caller who administers this
                        workspace. Anyone who does not have access to it approves the records successfully but lands on a
                        page they cannot open. Approving is what writes the records; verification then proceeds on its own,
                        so nothing depends on completing that return trip.
                    example: https://dash.cloudflare.com/domainconnect/v1/domaintemplates/apply?domain=acme.com&host=api
            additionalProperties: false
        Domain:
            type: object
            required:
                - id
                - domain
                - projectId
                - appId
                - environmentId
                - status
                - dnsRecords
                - createdAt
            properties:
                id:
                    "$ref": "#/components/schemas/ResourceIdentifier"
                domain:
                    type: string
                    minLength: 4
                    maxLength: 253
                    description: Fully qualified domain name attached to the environment.
                    example: api.acme.com
                projectId:
                    type: string
                    minLength: 8
                    maxLength: 255
                    pattern: "^[a-zA-Z0-9_]+$"
                    description: The project the domain's environment belongs to.
                    example: proj_1234abcd
                appId:
                    type: string
                    minLength: 8
                    maxLength: 255
                    pattern: "^[a-zA-Z0-9_]+$"
                    description: The app the domain's environment belongs to.
                    example: app_1234abcd
                environmentId:
                    type: string
                    minLength: 8
                    maxLength: 255
                    pattern: "^[a-zA-Z0-9_]+$"
                    description: |
                        The environment this domain serves. Traffic to the domain reaches whatever is currently
                        deployed to this environment.
                    example: env_1234abcd
                status:
                    type: string
                    enum:
                        - pending
                        - verifying
                        - verified
                        - failed
                    x-enum-varnames:
                        - DomainStatusPending
                        - DomainStatusVerifying
                        - DomainStatusVerified
                        - DomainStatusFailed
                    description: |
                        The verification status of the domain.

                        - `pending`: the domain is created. No DNS check has completed yet.
                        - `verifying`: Teral checks the DNS records approximately each minute.
                        - `verified`: the domain is verified. Teral has configured routing and requested a certificate.
                        - `failed`: the required DNS records did not appear within 24 hours. Fix the records, then retry verification.
                    example: verified
                verificationError:
                    type: string
                    maxLength: 512
                    description: |
                        Why the most recent verification attempt did not succeed, in plain language.
                        Omitted while verification is progressing normally.
                    example: domain verification timed out after 24 hours
                dnsRecords:
                    type: array
                    minItems: 1
                    items:
                        "$ref": "#/components/schemas/DnsRecord"
                    description: |
                        The DNS records this domain needs. Create each record at your DNS provider.
                        Each record has a `verified` flag. The flag shows whether Teral has read that record back,
                        so it tells you which records are still missing.
                domainConnect:
                    "$ref": "#/components/schemas/DomainConnect"
                createdAt:
                    type: integer
                    format: int64
                    description: Unix timestamp in milliseconds when the domain was created. The 24 hour verification window runs from here.
                    example: 1704067200000
                updatedAt:
                    type: integer
                    format: int64
                    description: Unix timestamp in milliseconds of the last change to this domain. Omitted if it has never changed.
                    example: 1704153600000
            additionalProperties: false
        Environment:
            type: object
            required:
                - id
                - slug
                - description
                - kind
                - deleteProtection
                - createdAt
            properties:
                id:
                    type: string
                    description: |
                        The unique identifier of the environment, generated by Teral.
                    example: env_1234abcd
                slug:
                    type: string
                    description: |
                        Human-readable slug of the environment, unique within its app.
                    example: production
                description:
                    type: string
                    description: |
                        Human-readable description of this environment.
                        Empty string if none was provided.
                    example: Production environment
                kind:
                    "$ref": "#/components/schemas/EnvironmentKind"
                    description: |
                        How deployments in this environment participate in the deployment lifecycle.
                deleteProtection:
                    type: boolean
                    description: |
                        Whether delete protection is enabled for this environment.
                        When true, the environment cannot be deleted until protection is disabled.
                    example: false
                createdAt:
                    type: integer
                    format: int64
                    minimum: 0
                    maximum: 9223372036854775807
                    description: |
                        Unix timestamp in milliseconds when the environment was created.
                    example: 1704067200000
                updatedAt:
                    type: integer
                    format: int64
                    minimum: 0
                    maximum: 9223372036854775807
                    description: |
                        Unix timestamp in milliseconds when the environment was last updated.
                        Omitted if the environment has never been updated.
                    example: 1704153600000
                    x-go-type-skip-optional-pointer: true
                    x-go-type-skip-optional-pointer-with-omitzero: true
                runtime:
                    "$ref": "#/components/schemas/EnvironmentRuntime"
                build:
                    "$ref": "#/components/schemas/EnvironmentBuild"
                regions:
                    type: array
                    items:
                        "$ref": "#/components/schemas/EnvironmentRegion"
                    description: |
                        Per-region deployment settings for this environment.
                        Empty until regional settings are configured.
            additionalProperties: false
        EnvironmentKind:
            type: string
            enum:
                - production
                - preview
            description: |
                The deployment lifecycle role of an environment.

                - `production`: Deployments serve production traffic, support promotion and rollback, and cannot be stopped.
                - `preview`: Deployments can be stopped and started and are eligible for preview lifecycle automation.
            example: production
        EnvironmentRuntime:
            type: object
            description: |
                Runtime settings that control how the container runs.
                Omitted until the environment has runtime settings.
            required:
                - port
                - vCpus
                - memoryMib
                - storageMib
                - command
                - shutdownSignal
                - upstreamProtocol
            properties:
                port:
                    type: integer
                    description: |
                        Port the container listens on.
                    example: 8080
                vCpus:
                    type: number
                    format: double
                    description: |
                        CPU allocation in vCPUs (1 = one vCPU, 0.5 = half a vCPU).
                    example: 0.25
                memoryMib:
                    type: integer
                    description: |
                        Memory allocation in mebibytes.
                    example: 256
                storageMib:
                    type: integer
                    description: |
                        Ephemeral storage allocation in mebibytes.
                    example: 0
                command:
                    type: array
                    items:
                        type: string
                    description: |
                        Container entrypoint command override.
                    example: ["node", "server.js"]
                healthcheck:
                    "$ref": "#/components/schemas/EnvironmentHealthcheck"
                shutdownSignal:
                    "$ref": "#/components/schemas/EnvironmentShutdownSignal"
                upstreamProtocol:
                    "$ref": "#/components/schemas/EnvironmentUpstreamProtocol"
                openapiSpecPath:
                    type: string
                    description: |
                        Path to the OpenAPI spec served by the container, if any.
                    example: /openapi.yaml
            additionalProperties: false
        EnvironmentBuild:
            type: object
            description: |
                Build settings that control how the app is built.
                Omitted until the environment has build settings.
            required:
                - rootDirectory
                - watchPaths
                - autoDeploy
            properties:
                dockerfile:
                    type: string
                    description: |
                        Path to the Dockerfile used to build the app, if any.
                    example: Dockerfile
                rootDirectory:
                    type: string
                    description: |
                        The directory the app is built from. "." for the repository root.
                    example: .
                buildCommand:
                    type: string
                    description: |
                        Overrides the build command auto-detected by Railpack, so monorepos can
                        scope the build to a single app. Omitted when left to auto-detection or
                        for Dockerfile builds.
                    example: pnpm --filter api build
                watchPaths:
                    type: array
                    items:
                        type: string
                    description: |
                        Paths that trigger a rebuild when changed.
                    example: ["src/**"]
                autoDeploy:
                    type: boolean
                    description: |
                        Whether pushes automatically trigger a deployment.
                    example: true
            additionalProperties: false
        EnvironmentRegion:
            type: object
            description: Replica bounds for a single region the environment deploys to.
            required:
                - name
                - replicas
            properties:
                name:
                    type: string
                    minLength: 1
                    maxLength: 64
                    description: Region name, such as us-east-1.
                    example: us-east-1
                replicas:
                    "$ref": "#/components/schemas/Replicas"
            additionalProperties: false
        Replicas:
            type: object
            description: Min and max replica bounds for autoscaling in a region.
            required:
                - min
                - max
            properties:
                min:
                    type: integer
                    description: Minimum number of replicas.
                    example: 1
                max:
                    type: integer
                    description: Maximum number of replicas.
                    example: 3
            additionalProperties: false
        EnvironmentVariable:
            type: object
            required:
                - key
                - kind
                - createdAt
            properties:
                key:
                    type: string
                    description: The variable name.
                    example: DATABASE_URL
                kind:
                    "$ref": "#/components/schemas/EnvironmentVariableKind"
                value:
                    type: string
                    x-teral-redact: true
                    description: |
                        The decrypted plaintext value. Present only for `recoverable` variables.
                        Omitted for `writeonly` variables, which can never be read back.
                    x-go-type-skip-optional-pointer: true
                    example: postgresql://user:pass@host:5432/db
                description:
                    type: string
                    description: Human-readable description. Omitted if none was provided.
                    example: Primary database connection string
                    x-go-type-skip-optional-pointer: true
                createdAt:
                    type: integer
                    format: int64
                    minimum: 0
                    maximum: 9223372036854775807
                    description: Unix timestamp in milliseconds when the variable was created.
                    example: 1704067200000
            additionalProperties: false
        EnvironmentVariableKind:
            type: string
            enum:
                - recoverable
                - writeonly
            description: |
                How the value may be read back. `writeonly` values can never be read back
                through the API; `recoverable` values can be decrypted. Values are encrypted
                at rest either way.
            example: writeonly
        EnvironmentVariableInput:
            type: object
            description: A single environment variable to set.
            required:
                - key
                - value
            properties:
                key:
                    type: string
                    minLength: 1
                    maxLength: 256
                    pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
                    description: |
                        The variable name. Must be a POSIX shell name: letters, digits, and
                        underscores only, and must not start with a digit. Other names are
                        unreachable from shells and most runtimes.
                    example: DATABASE_URL
                value:
                    type: string
                    minLength: 1
                    maxLength: 16384
                    description: |
                        The variable value. Always encrypted at rest. The limit is enforced
                        server-side in UTF-8 bytes, so a multibyte value may be rejected before
                        it reaches this code-point maximum.
                    example: postgresql://user:pass@host:5432/db
                kind:
                    allOf:
                        - "$ref": "#/components/schemas/EnvironmentVariableKind"
                    default: writeonly
                    description: |
                        How the value may be read back. Defaults to `writeonly`.
                description:
                    type: string
                    maxLength: 255
                    description: |
                        Human-readable description of the variable.
                    example: Primary database connection string
            additionalProperties: false
        V1GatewayListPoliciesResponseData:
            type: array
            maxItems: 50
            description: The environment's gateway policies in evaluation order.
            items:
                "$ref": "#/components/schemas/PolicyResponse"
        PolicyResponse:
            type: object
            required:
                - id
                - name
                - enabled
            properties:
                id:
                    type: string
                    description: Server-generated policy id. Regenerated on every `gateway.setPolicies` call, so treat it as stable only until the environment's policies are next replaced.
                    example: pol_2gJbXhAr4
                name:
                    type: string
                    minLength: 1
                    maxLength: 256
                    description: Human-readable name shown in the dashboard.
                enabled:
                    type: boolean
                    description: Disabled policies are stored but skipped during evaluation.
                match:
                    type: array
                    maxItems: 10
                    items:
                        "$ref": "#/components/schemas/MatchExpr"
                    description: |-
                        Optional request matchers. The policy applies only to requests matching
                        all expressions; omitted when the policy applies to every request.
                firewall:
                    "$ref": "#/components/schemas/FirewallPolicy"
                logging:
                    "$ref": "#/components/schemas/LoggingPolicy"
            additionalProperties: false
            description: |-
                A stored gateway policy as returned by list endpoints. Exactly one of
                `firewall`, or `logging` is set.
            example:
                id: pol_2gJbXhAr4
                name: Block internal paths
                enabled: true
                match:
                    - path:
                        path:
                            prefix: /internal/
                firewall:
                    action: ACTION_DENY
        MatchExpr:
            type: object
            properties:
                path:
                    "$ref": "#/components/schemas/PathMatch"
                method:
                    "$ref": "#/components/schemas/MethodMatch"
                header:
                    "$ref": "#/components/schemas/FieldMatch"
                queryParam:
                    "$ref": "#/components/schemas/FieldMatch"
                remoteIp:
                    "$ref": "#/components/schemas/RemoteIpMatch"
            additionalProperties: false
            description: |-
                A single request match expression. Exactly one of `path`, `method`,
                `header`, `queryParam` or `remoteIp` must be set.
            example:
                path:
                    path:
                        prefix: /api/
        FirewallPolicy:
            type: object
            required:
                - action
            properties:
                action:
                    type: string
                    enum:
                        - ACTION_DENY
                    description: What to do with matching requests.
            additionalProperties: false
            description: Blocks matching requests.
            example:
                action: ACTION_DENY
        LoggingPolicy:
            type: object
            properties:
                requestHeaders:
                    type: boolean
                    default: false
                    description: |-
                        Capture request headers, the user agent, and the client IP. The user
                        agent and client IP are included because they identify the client.
                responseHeaders:
                    type: boolean
                    default: false
                    description: Capture response headers.
                requestBody:
                    type: boolean
                    default: false
                    description: Capture the request body, up to the capture limit.
                responseBody:
                    type: boolean
                    default: false
                    description: Capture the response body, up to the capture limit.
                query:
                    type: boolean
                    default: false
                    description: |-
                        Capture the query string and query parameters. Query data is a
                        separate opt-in because URLs can contain secrets, for example
                        `?api_key=...`.
            additionalProperties: false
            description: |-
                Adds request data to the log entries of matching requests. The gateway
                always records a basic log entry for every request: method, host, path,
                status, and latency. Each capture setting is a separate opt-in: request
                headers, response headers, request body, response body, and query data.
                The policy's `match` expressions select the requests. A policy without
                `match` expressions matches every request. If more than one enabled
                logging policy matches a request, the gateway combines their settings.
                The gateway always redacts the `Authorization` header and configured key
                locations before it stores headers or query data.
            example:
                requestHeaders: true
                responseHeaders: true
                requestBody: true
                responseBody: true
                query: true
        PathMatch:
            type: object
            required:
                - path
            properties:
                path:
                    "$ref": "#/components/schemas/StringMatch"
            additionalProperties: false
            description: Matches on the request path.
        MethodMatch:
            type: object
            required:
                - methods
            properties:
                methods:
                    type: array
                    minItems: 1
                    items:
                        type: string
                        enum:
                            - GET
                            - POST
                            - PUT
                            - PATCH
                            - DELETE
                            - HEAD
                            - OPTIONS
            additionalProperties: false
            description: Matches when the request method is one of the listed methods.
        FieldMatch:
            type: object
            required:
                - name
            properties:
                name:
                    type: string
                    minLength: 1
                    maxLength: 256
                present:
                    type: boolean
                    enum:
                        - true
                    description: Matches when the field is present, regardless of value.
                value:
                    "$ref": "#/components/schemas/StringMatch"
            additionalProperties: false
            description: |-
                Matches a named request field (header or query parameter). Exactly one of
                `present` or `value` must be set.
        RemoteIpMatch:
            type: object
            properties:
                in:
                    type: array
                    minItems: 1
                    maxItems: 100
                    items:
                        type: string
                        minLength: 1
                        maxLength: 43
                    description: |-
                        Matches when the remote IP is in at least one of these ranges. Entries
                        are CIDRs such as `203.0.113.0/24` or single addresses such as
                        `203.0.113.7`.
                notIn:
                    type: array
                    minItems: 1
                    maxItems: 100
                    items:
                        type: string
                        minLength: 1
                        maxLength: 43
                    description: |-
                        Matches when the remote IP is in none of these ranges. Entries are CIDRs
                        such as `198.51.100.0/24` or single addresses such as `198.51.100.7`.
            additionalProperties: false
            description: |-
                Matches the remote IP against IPv4 or IPv6 CIDR ranges. Exactly one of `in`
                or `notIn` must be set. Entries are rejected if they have host bits set (such
                as `10.1.2.3/8`), are IPv4-mapped IPv6 addresses, or carry a zone. Single
                addresses are returned as full-length prefixes, such as `203.0.113.7/32`.
            example:
                notIn:
                    - 198.51.100.0/24
        StringMatch:
            type: object
            properties:
                exact:
                    type: string
                    minLength: 1
                    maxLength: 1024
                    description: Matches when the input equals this value.
                prefix:
                    type: string
                    minLength: 1
                    maxLength: 1024
                    description: Matches when the input starts with this value.
                regex:
                    type: string
                    minLength: 1
                    maxLength: 1024
                    description: |-
                        Matches when the input satisfies this RE2 regular expression. Invalid
                        patterns are rejected when the policy is created.
                ignoreCase:
                    type: boolean
                    description: Compare case-insensitively. May accompany any match mode.
            additionalProperties: false
            description: |-
                String matcher. Exactly one of `exact`, `prefix` or `regex` must be set.
            example:
                prefix: /api/
                ignoreCase: true
        Policy:
            type: object
            required:
                - name
                - enabled
            properties:
                name:
                    type: string
                    minLength: 1
                    maxLength: 256
                    description: Human-readable name shown in the dashboard.
                enabled:
                    type: boolean
                    description: Disabled policies are stored but skipped during evaluation.
                match:
                    type: array
                    maxItems: 10
                    items:
                        "$ref": "#/components/schemas/MatchExpr"
                    description: |-
                        Optional request matchers. The policy applies only to requests matching
                        all expressions; omit to apply to every request.
                firewall:
                    "$ref": "#/components/schemas/FirewallPolicy"
                logging:
                    "$ref": "#/components/schemas/LoggingPolicy"
            additionalProperties: false
            description: |-
                A gateway policy. Exactly one of `firewall`,
                or `logging` must be set. The server generates an id for every
                policy it stores.
            example:
                name: Block internal paths
                enabled: true
                match:
                    - path:
                        path:
                            prefix: /internal/
                firewall:
                    action: ACTION_DENY
        V1GithubInstallAppResponseData:
            type: object
            required:
                - url
                - expiresAt
            properties:
                url:
                    type: string
                    format: uri
                    description: |
                        The GitHub App install URL. Open it in a browser to install the app and
                        grant repository access. After installation GitHub returns to Teral, which
                        binds the installation and lands you in the workspace settings.
                    example: https://github.com/apps/teral/installations/new?state=eyJ...
                expiresAt:
                    type: integer
                    format: int64
                    description: |
                        Unix timestamp in milliseconds after which the URL's signed state expires
                        and the link must be requested again.
                    example: 1700000900000
            additionalProperties: false
        V1LivenessResponseData:
            type: object
            properties:
                message:
                    description: Status message indicating the health of the service. A value of 'OK' indicates that the service is functioning properly and ready to accept requests. Any other value indicates a potential issue with the service health.
                    example: OK
                    type: string
            required:
                - message
            description: Response data for the liveness check endpoint. This provides a simple indication of whether the Teral API service is running and able to process requests. Monitoring systems can use this endpoint to track service availability and trigger alerts if the service becomes unhealthy.
        V1LogsGetBuildLogsResponseData:
            type: object
            required:
                - status
                - steps
                - lines
                - nextSeq
                - hasMore
            properties:
                status:
                    "$ref": "#/components/schemas/DeploymentStatus"
                steps:
                    type: array
                    items:
                        "$ref": "#/components/schemas/BuildStep"
                lines:
                    type: array
                    items:
                        "$ref": "#/components/schemas/BuildLogLine"
                nextSeq:
                    type: integer
                    format: int64
                    description: Pass as `afterSeq` to continue after the last returned line.
                hasMore:
                    type: boolean
                    description: True when more lines are available right now; fetch again without waiting.
            additionalProperties: false
        BuildStep:
            type: object
            required:
                - id
                - name
                - startedAt
                - cached
            properties:
                id:
                    type: string
                name:
                    type: string
                    example: "[build 3/7] RUN npm ci"
                startedAt:
                    type: integer
                    format: int64
                completedAt:
                    type: integer
                    format: int64
                    description: Omitted while the step is running.
                cached:
                    type: boolean
                error:
                    type: string
                    x-go-type-skip-optional-pointer: true
            additionalProperties: false
        BuildLogLine:
            type: object
            required:
                - seq
                - time
                - stepId
                - message
                - stderr
            properties:
                seq:
                    type: integer
                    format: int64
                time:
                    type: integer
                    format: int64
                stepId:
                    type: string
                message:
                    type: string
                stderr:
                    type: boolean
            additionalProperties: false
        RuntimeLog:
            type: object
            required:
                - id
                - time
                - severity
                - message
                - deploymentId
                - region
            properties:
                id:
                    type: string
                    description: Stable identifier of the line. Use it to de-duplicate overlapping polls.
                time:
                    type: integer
                    format: int64
                    description: Unix milliseconds when the line was written.
                severity:
                    type: string
                    example: INFO
                message:
                    type: string
                deploymentId:
                    type: string
                region:
                    type: string
                    example: eu-central-1
                instanceId:
                    type: string
                    description: Instance that wrote the line, when known.
                    x-go-type-skip-optional-pointer: true
                attributes:
                    type: object
                    additionalProperties: true
                    description: Structured fields parsed from JSON or key=value log lines.
            additionalProperties: false
        V1ProjectsCreateProjectResponseData:
            type: object
            required:
                - id
            properties:
                id:
                    type: string
                    minLength: 8
                    maxLength: 255
                    pattern: "^[a-zA-Z0-9_]+$"
                    description: |
                        The unique identifier of the newly created project, generated by Teral.
                        Always begins with 'proj_' followed by a unique alphanumeric sequence.
                    example: proj_1234abcd
            additionalProperties: false
        Project:
            type: object
            required:
                - id
                - name
                - slug
                - createdAt
                - deleteProtection
            properties:
                id:
                    type: string
                    description: |
                        The unique identifier of the project, generated by Teral.
                    example: proj_1234abcd
                name:
                    type: string
                    description: |
                        Human-readable name for this project.
                    example: Payments Service
                slug:
                    type: string
                    description: |
                        URL-safe handle for this project, unique within your workspace.
                        This is the caller-defined identifier used to reference the project in get, update, and delete operations.
                    example: payments-service
                createdAt:
                    type: integer
                    format: int64
                    minimum: 0
                    maximum: 9223372036854775807
                    description: |
                        Unix timestamp in milliseconds when the project was created.
                    example: 1704067200000
                updatedAt:
                    type: integer
                    format: int64
                    minimum: 0
                    maximum: 9223372036854775807
                    description: |
                        Unix timestamp in milliseconds when the project was last updated.
                        Omitted if the project has never been updated.
                    example: 1704153600000
                    x-go-type-skip-optional-pointer: true
                    x-go-type-skip-optional-pointer-with-omitzero: true
                deleteProtection:
                    type: boolean
                    description: |
                        Whether delete protection is enabled for this project.
                        When true, the project cannot be deleted until protection is disabled.
                    example: false
            additionalProperties: false
info:
    description: |-
        Teral's API provides programmatic access for all resources within our platform.

        ### License and source code
        #
        Teral is a modified version of Unkey and is licensed under the GNU Affero General Public License v3 (AGPL-3.0). You can download the complete source code of every deployed version at https://teral-source.s3.eu-central-1.amazonaws.com/index.html. Every API response carries an `X-Teral-Source` header that links to the source of the exact version that answered it, and an `X-Teral-License` header naming the license.


        ### Authentication
        #
        This API uses HTTP Bearer authentication with api keys. Most endpoints require specific permissions associated with your api key. When making requests, include your api key in the `Authorization` header:
        ```
        Authorization: Bearer teral_xxxxxxxxxxx
        ```

        All responses follow a consistent envelope structure that separates operational metadata from actual data. This design provides several benefits:
        - Debugging: Every response includes a unique requestId for tracing issues
        - Consistency: Predictable response format across all endpoints
        - Extensibility: Easy to add new metadata without breaking existing integrations
        - Error Handling: Unified error format with actionable information

        ### Success Response Format:
        ```json
        {
          "meta": {
            "requestId": "req_123456"
          },
          "data": {
            // Actual response data here
          }
        }
        ```

        The meta object contains operational information:
        - `requestId`: Unique identifier for this request (essential for support)

        The data object contains the actual response data specific to each endpoint.

        ### Paginated Response Format:
        ```json
        {
          "meta": {
            "requestId": "req_123456"
          },
          "data": [
            // Array of results
          ],
          "pagination": {
            "cursor": "next_page_token",
            "hasMore": true
          }
        }
        ```

        The pagination object appears on list endpoints and contains:
        - `cursor`: Token for requesting the next page
        - `hasMore`: Whether more results are available

        ### Error Response Format:
        ```json
        {
          "meta": {
            "requestId": "req_2c9a0jf23l4k567"
          },
          "error": {
            "detail": "The resource you are attempting to modify is protected and cannot be changed",
            "status": 403,
            "title": "Forbidden",
            "type": "https://docs.teral.dev/errors/teral/application/protected_resource"
          }
        }
        ```

        Error responses include comprehensive diagnostic information:
        - `title`: Human-readable error summary
        - `detail`: Specific description of what went wrong
        - `status`: HTTP status code
        - `type`: Link to error documentation
        - `errors`: Array of validation errors (for 400 responses)

        This structure ensures you always have the context needed to debug issues and take corrective action.
    license:
        name: AGPL-3.0
        url: https://www.gnu.org/licenses/agpl-3.0.html
    title: Teral API
    version: 1.0.0
openapi: 3.1.0
paths:
    /v1/apiKeys.createKey:
        post:
            description: |
                Creates a API key for the authenticated workspace.
                Requires `teral:v1:<workspace_id>:rootKeys/*#write`.
                The created API key cannot have more permissions than the caller.
            operationId: apiKeys.createKey
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/V1ApiKeysCreateKeyRequestBody'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/V1ApiKeysCreateKeyResponseBody'
                    description: API key created. Save the secret now; it cannot be retrieved later.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BadRequestErrorResponse'
                    description: Invalid input or unsupported permission.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UnauthorizedErrorResponse'
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ForbiddenErrorResponse'
                    description: Requires a workspace admin or an authorized API key, and grants within the caller's permissions.
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InternalServerErrorResponse'
                    description: Internal server error, including missing or invalid root-key storage configuration.
            summary: Create API key
            tags:
                - apiKeys
            x-speakeasy-name-override: createKey
    /v1/apiKeys.deleteKey:
        post:
            description: |
                Deletes a API key in the authenticated workspace.
                Requires `teral:v1:<workspace_id>:rootKeys/<key_id>#delete`.
                Use `rootKeys/*#delete` to delete any API key in the workspace.
                Deleted keys cannot authenticate.
            operationId: apiKeys.deleteKey
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/V1ApiKeysDeleteKeyRequestBody'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/V1ApiKeysDeleteKeyResponseBody'
                    description: API key deleted.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BadRequestErrorResponse'
                    description: Invalid request.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UnauthorizedErrorResponse'
                    description: Authentication is required.
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ForbiddenErrorResponse'
                    description: The caller cannot delete this API key.
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/NotFoundErrorResponse'
