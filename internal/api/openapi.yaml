                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ForbiddenErrorResponse'
                    description: Forbidden - Insufficient permissions (requires `environment.*.update_policy`)
                "404":
                    content:
                        application/json:
