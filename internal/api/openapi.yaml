                            type: string
                            enum:
                                - api_key
                                - cli_session
                                - user
                            description: |
                                - `api_key`: a workspace API key, typically used in CI.
                                - `cli_session`: a session created by `teral login`.
                                - `user`: a signed-in dashboard user.
                        id:
                            type: string
                            description: The API key id, or the user id for CLI sessions and dashboard users.
                            example: user_01HXYZ
                        name:
                            type: string
                            example: Fynn Bauer
                        email:
                            type: string
                            example: fynn@example.com
                            x-go-type-skip-optional-pointer: true
                        sessionId:
                            type: string
                            description: The CLI session id. Present only for `cli_session`.
                            example: clis_4fQm9XkV2u8s
                            x-go-type-skip-optional-pointer: true
                        expiresAt:
                            type: integer
                            format: int64
                            description: Unix milliseconds when the credential expires. Omitted for credentials that do not expire.
                    additionalProperties: false
                roles:
                    type: array
                    items:
                        type: string
                    description: Organization roles of the user. Omitted for API keys.
                    example: ["admin"]
                permissions:
                    type: array
                    items:
                        type: string
                    description: Effective permissions of the credential.
            additionalProperties: false
        WorkspaceSummary:
            type: object
            required:
                - id
                - slug
                - name
            properties:
                id:
                    type: string
                    example: ws_1234abcd
                slug:
                    type: string
                    example: acme
                name:
                    type: string
                    example: Acme Inc
            additionalProperties: false
        V1CliApproveDeviceAuthorizationResponseData:
            type: object
            required:
                - status
            properties:
