                        "$ref": "#/components/schemas/Project"
                    description: Array of projects in the workspace, ordered by project id.
                pagination:
                    "$ref": "#/components/schemas/Pagination"
            additionalProperties: false
        V1ProjectsUpdateProjectRequestBody:
            type: object
            required:
                - project
            properties:
                project:
                    "$ref": "#/components/schemas/ResourceIdentifier"
                slug:
                    "$ref": "#/components/schemas/ResourceIdentifier"
                name:
                    type: string
                    minLength: 1
                    maxLength: 256
                    description: |
                        New human-readable name for the project.
                        Omit this field to leave the current name unchanged.
                    example: Payments Service
                deleteProtection:
                    type: boolean
                    description: |
                        Enable or disable delete protection for the project.
                        Omit this field to leave the current setting unchanged.
                    example: true
            additionalProperties: false
        V1ProjectsUpdateProjectResponseBody:
            type: object
            required:
                - meta
                - data
            properties:
                meta:
                    "$ref": "#/components/schemas/Meta"
                data:
                    "$ref": "#/components/schemas/Project"
            additionalProperties: false
        Meta:
            type: object
            required:
                - requestId
            properties:
                requestId:
                    description: A unique id for this request. Always include this ID when contacting support about a specific API request. This identifier allows Teral's support team to trace the exact request through logs and diagnostic systems to provide faster assistance.
                    example: req_123
                    type: string
            additionalProperties: false
            description: Metadata object included in every API response. This provides context about the request and is essential for debugging, audit trails, and support inquiries. The `requestId` is particularly important when troubleshooting issues with the Teral support team.
        V1ApiKeysCreateKeyResponseData:
            type: object
            required:
                - keyId
                - key
            properties:
                keyId:
                    type: string
                    description: Identifier used to manage the API key.
                key:
                    type: string
                    x-teral-redact: true
                    description: API key secret, returned only once. Store it securely.
        BadRequestErrorDetails:
            allOf:
                - $ref: "#/components/schemas/BaseError"
                - type: object
                  properties:
                    errors:
                        description: List of individual validation errors that occurred in the request. Each error provides specific details about what failed validation, where the error occurred in the request, and suggestions for fixing it. This granular information helps developers quickly identify and resolve multiple issues in a single request without having to make repeated API calls.
                        items:
                            $ref: "#/components/schemas/ValidationError"
                        type: array
                  required:
                    - errors
            description: Extended error details specifically for bad request (400) errors. This builds on the BaseError structure by adding an array of individual validation errors, making it easy to identify and fix multiple issues at once.
        BaseError:
            properties:
                detail:
                    description: A human-readable explanation specific to this occurrence of the problem. This provides detailed information about what went wrong and potential remediation steps. The message is intended to be helpful for developers troubleshooting the issue.
                    example: Property foo is required but is missing.
                    type: string
                status:
                    description: HTTP status code that corresponds to this error. This will match the status code in the HTTP response. Common codes include `400` (Bad Request), `401` (Unauthorized), `403` (Forbidden), `404` (Not Found), `409` (Conflict), and `500` (Internal Server Error).
                    example: 404
                    format: int
                    type: integer
                title:
                    description: A short, human-readable summary of the problem type. This remains constant from occurrence to occurrence of the same problem and should be used for programmatic handling.
                    example: Not Found
                    type: string
                type:
                    description: A URI reference that identifies the problem type. This provides a stable identifier for the error that can be used for documentation lookups and programmatic error handling. When followed, this URI should provide human-readable documentation for the problem type.
                    example: https://docs.teral.dev/errors/teral/resource/not_found
                    type: string
            required:
                - title
                - detail
                - status
                - type
            type: object
            additionalProperties: false
            description: Base error structure following Problem Details for HTTP APIs (RFC 7807). This provides a standardized way to carry machine-readable details of errors in HTTP response content.
        ValidationError:
            additionalProperties: false
            properties:
                location:
                    description: |-
                        JSON path indicating exactly where in the request the error occurred. This helps pinpoint the problematic field or parameter. Examples include:
                        - 'body.name' (field in request body)
                        - 'body.items[3].tags' (nested array element)
                        - 'path.apiId' (path parameter)
                        - 'query.limit' (query parameter)
                        Use this location to identify exactly which part of your request needs correction.
                    type: string
                    example: body.permissions[0].name
                message:
                    description: Detailed error message explaining what validation rule was violated. This provides specific information about why the field or parameter was rejected, such as format errors, invalid values, or constraint violations.
                    type: string
                    example: Must be at least 3 characters long
                fix:
                    description: A human-readable suggestion describing how to fix the error. This provides practical guidance on what changes would satisfy the validation requirements. Not all validation errors include fix suggestions, but when present, they offer specific remediation advice.
                    type: string
                    example: Ensure the name uses only alphanumeric characters, underscores, and hyphens
            required:
                - location
                - message
            type: object
            description: Individual validation error details. Each validation error provides precise information about what failed, where it failed, and how to fix it, enabling efficient error resolution.
        EmptyResponse:
            type: object
            properties: {}
            additionalProperties: false
            description: Empty response object by design. A successful response indicates this operation was successfully executed.
        V1ApiKeysListKeysResponseData:
            type: object
            additionalProperties: false
            required:
                - keyId
                - name
                - start
                - end
                - enabled
                - createdAt
                - lastUsedAt
                - expires
                - permissions
            properties:
                keyId:
                    type: string
                    description: Stable API key identifier.
                name:
                    type:
                        - string
                        - "null"
                    description: User-supplied name, or null when absent.
                start:
                    type: string
                    description: Stored display fragment, including the prefix when present.
                end:
                    type: string
                    description: Stored trailing display fragment. Empty for keys without a recorded suffix.
                enabled:
                    type: boolean
                    description: Whether the key is administratively enabled. An enabled key can still be expired.
                createdAt:
                    type: integer
                    format: int64
                    description: Creation time in Unix milliseconds.
                lastUsedAt:
                    type: integer
                    format: int64
                    minimum: 0
                    description: Last verification time in Unix milliseconds. Zero means the API key has not been used.
                expires:
                    type:
                        - integer
                        - "null"
                    format: int64
                    description: Expiration time in Unix milliseconds, or null for no expiration.
                permissions:
                    type: array
                    description: All permissions assigned to the API key.
                    items:
                        type: string
        Pagination:
            type: object
            properties:
                cursor:
                    type: string
                    minLength: 1
                    maxLength: 1024
                    description: |
                        Opaque pagination token for retrieving the next page of results.
                        Include this exact value in the cursor field of subsequent requests.
                        Cursors are temporary and may expire after extended periods.
                    example: eyJrZXkiOiJrZXlfMTIzNCIsInRzIjoxNjk5Mzc4ODAwfQ==
                hasMore:
                    type: boolean
                    description: |
                        Indicates whether additional results exist beyond this page.
                        When true, use the cursor to fetch the next page.
                        When false, you have reached the end of the result set.
                    example: true
            required:
                - hasMore
            additionalProperties: false
            description: Pagination metadata for list endpoints. Provides information necessary to traverse through large result sets efficiently using cursor-based pagination.
        V1ApiKeysRerollKeyResponseData:
            type: object
            additionalProperties: false
            required:
                - keyId
                - key
            properties:
                keyId:
                    type: string
                    description: Identifier of the new API key.
                key:
                    type: string
                    x-teral-redact: true
                    description: New API key secret, returned only once. Store it securely.
        ResourceIdentifier:
            type: string
            minLength: 3
            maxLength: 255
            pattern: "^[a-zA-Z0-9_-]+$"
            description: |
                Identifies a resource by either its unique ID or its slug.
                Accepts a prefixed ID (such as 'proj_' or 'app_') or a slug.
            example: proj_1234abcd
        AppGitCreateInput:
            type: object
            description: |
                Configure Git as the app source. Provide `repository` to connect it during
                creation, or use an empty object to connect a repository later.
            properties:
                repository:
                    type: string
                    minLength: 1
                    maxLength: 255
                    description: |
                        The GitHub repository to connect, as "owner/repo". The workspace must have
                        the Teral GitHub App installed with access to it. Omit this field to create
                        the Git app before selecting its repository.
                    example: teraldev/teral
                defaultBranch:
                    type: string
                    minLength: 1
                    maxLength: 256
                    description: |
                        The branch this app's deployments track. This requires `repository`.
                        Omit it to adopt the repository's default branch on GitHub.
                    example: main
            additionalProperties: false
        AppOCI:
            type: object
            description: An app's OCI image source.
            required:
                - image
            properties:
                image:
                    type: string
                    minLength: 1
                    maxLength: 256
                    pattern: "\\S"
                    description: The configured default OCI image reference for new deployments. It must include an explicit tag or digest.
                    example: ghcr.io/acme/api:v1.2.3
            additionalProperties: false
        V1AppsCreateAppResponseData:
            type: object
            required:
                - appId
            properties:
                appId:
                    type: string
                    minLength: 8
                    maxLength: 255
                    pattern: "^[a-zA-Z0-9_]+$"
                    description: |
                        The unique identifier of the newly created app, generated by Teral.
                        Always begins with 'app_' followed by a unique alphanumeric sequence.
                    example: app_1234abcd
            additionalProperties: false
        App:
            type: object
            required:
                - id
                - name
                - slug
                - isRolledBack
                - deleteProtection
                - createdAt
            properties:
                id:
                    type: string
                    description: |
                        The unique identifier of the app, generated by Teral.
                    example: app_1234abcd
                name:
                    type: string
                    description: |
                        Human-readable name for this app.
                    example: Payments API
                slug:
                    type: string
                    description: |
                        URL-safe handle for this app, unique within its project.
                        Chosen at creation time.
                    example: payments-api
                sourceType:
                    type: string
                    enum:
                        - git
                        - oci
                    description: |
                        The configured source used to create deployments. Omitted for historical
                        apps whose source could not be classified.
                    example: oci
                    x-go-type-skip-optional-pointer: true
                    x-go-type-skip-optional-pointer-with-omitzero: true
                git:
                    description: |
                        The connected GitHub repository and the branch its deployments track.
                        Omitted when the app has no repository connected (for example a
                        prebuilt OCI image app).
                    allOf:
                        - "$ref": "#/components/schemas/AppGit"
                oci:
                    description: |
                        The configured OCI image source. Omitted when the app is not OCI-sourced.
                    allOf:
                        - "$ref": "#/components/schemas/AppOCI"
                currentDeploymentId:
                    type: string
                    description: |
                        The identifier of the deployment currently serving this app.
                        Omitted if the app has no active deployment yet.
                    example: d_1234abcd
                    x-go-type-skip-optional-pointer: true
                    x-go-type-skip-optional-pointer-with-omitzero: true
                isRolledBack:
                    type: boolean
                    description: |
                        Whether the app is currently serving a rolled-back deployment rather than its latest one.
                    example: false
                deleteProtection:
                    type: boolean
                    description: |
                        Whether delete protection is enabled for this app.
                        When true, the app cannot be deleted until protection is disabled.
                    example: false
                createdAt:
                    type: integer
                    format: int64
                    minimum: 0
                    maximum: 9223372036854775807
                    description: |
                        Unix timestamp in milliseconds when the app was created.
                    example: 1704067200000
                updatedAt:
                    type: integer
                    format: int64
                    minimum: 0
                    maximum: 9223372036854775807
                    description: |
                        Unix timestamp in milliseconds when the app was last updated.
                        Omitted if the app has never been updated.
                    example: 1704153600000
                    x-go-type-skip-optional-pointer: true
                    x-go-type-skip-optional-pointer-with-omitzero: true
            additionalProperties: false
        AppGit:
            type: object
            required:
                - repository
            properties:
                repository:
                    type: string
                    minLength: 1
                    maxLength: 255
                    description: The connected GitHub repository, as "owner/repo".
                    example: teraldev/teral
                defaultBranch:
                    type: string
                    minLength: 1
                    maxLength: 256
                    description: The branch this app's deployments track.
                    example: main
            additionalProperties: false
        AppGitUpdateInput:
            type: object
            minProperties: 1
            properties:
                repository:
                    type: string
                    minLength: 1
                    maxLength: 255
                    description: |
                        The GitHub repository to connect, as "owner/repo". Omit to change only the
                        tracked branch of the already-connected repository. The workspace must have
                        the Teral GitHub App installed with access to it.
                    example: teraldev/teral
                defaultBranch:
                    type: string
                    minLength: 1
                    maxLength: 256
                    description: |
                        The branch this app's deployments track. Omit to adopt the repository's
                        GitHub default branch on a new connection, keep the current branch when
                        replacing an already-connected repository, or set it alone to retarget the
                        branch of the connected repository.
                    example: main
            additionalProperties: false
        V1AuthWhoamiResponseData:
            type: object
            required:
                - workspace
                - principal
                - permissions
