    /v1/domains.listDomains:
        post:
            description: |
                List your custom domains with their verification status and DNS records.
                Filter by project, app, or environment using IDs or slugs, or send `{}` to list
                domains across your workspace.

                Use any filter on its own or combine filters to narrow the results.
                Results match all supplied filters. Omitting `environment` includes all matching environments.

                Results include only domains you have permission to read, sorted by ID.
                When `hasMore` is true, send the returned `cursor` to get the next page.

                `status: verified` means the domain is verified. Teral has configured routing and requested a
                certificate. Each domain includes its full `dnsRecords`. Each record has a `verified` flag.
                The flag shows which records Teral has read back, so you can see which records are still
                missing without a second call. Some providers hide a record from DNS lookups, for example a
                proxied or flattened routing record. Such a record stays `false` while it serves traffic.

                **Required Permissions**

                Use a root key with the `environment.*.read_domain` permission.
                A successful request returns an empty list if no matching domains are readable by your key.
            operationId: domains.listDomains
            requestBody:
                content:
                    application/json:
                        examples:
                            byApp:
                                description: Includes all environments in apps matching this ID or slug, without restricting the project.
                                summary: List an app's domains across projects
                                value:
                                    app: payments-api
                            byAppAndEnvironment:
                                description: Includes matching environments within matching apps, without restricting the project.
                                summary: List an app's production domains across projects
                                value:
                                    app: payments-api
                                    environment: production
                            byEnvironment:
                                description: Includes every environment with ID or slug production, across all projects and apps.
                                summary: List production domains across the workspace
                                value:
                                    environment: production
                            byIds:
                                summary: List an environment's domains by its ID
                                value:
                                    environment: env_1234abcd
                            byProject:
                                description: Includes all apps and environments in projects matching this ID or slug.
                                summary: List a project's domains
                                value:
                                    project: payments
                            byProjectAndApp:
                                description: Includes all environments in matching apps within matching projects.
                                summary: List an app's domains within a project
                                value:
                                    app: payments-api
                                    project: payments
                            byProjectAndEnvironment:
                                description: Includes matching environments across all apps in matching projects.
                                summary: List a project's production domains
                                value:
                                    environment: production
                                    project: payments
                            bySlugs:
                                description: Includes environments matching all three identifiers within the specified project and app.
                                summary: List an environment's domains by slugs
                                value:
                                    app: payments-api
                                    environment: production
                                    project: payments
                            paginated:
                                description: Get a smaller page and continue from a cursor.
                                summary: Paginate with a smaller page size
                                value:
                                    app: payments-api
                                    cursor: dom_1234abcd
                                    environment: production
