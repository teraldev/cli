                                summary: List all domains in the workspace
                                value: {}
                        schema:
                            $ref: '#/components/schemas/V1DomainsListDomainsRequestBody'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            examples:
                                domainList:
                                    description: Two verified domains. The routing record verified the subdomain. The TXT record verified the apex domain, because Teral cannot read its alias back.
                                    summary: Domain list
                                    value:
