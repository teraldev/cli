                        Maximum number of deployments to return per request.
                        Balance between response size and number of pagination calls needed.
                    default: 100
                    minimum: 1
                    maximum: 100
                cursor:
                    type: string
                    description: |
                        Pagination cursor from a previous response to fetch the next page.
                        Use when `hasMore: true` in the previous response.
            additionalProperties: false
            description: |
                Filter deployments within a workspace. All filters are optional; with none
                set, every deployment in the workspace is returned, newest first.
        V1DeploymentsListDeploymentsResponseBody:
            type: object
            required:
                - meta
                - data
                - pagination
            properties:
                meta:
                    "$ref": "#/components/schemas/Meta"
                data:
                    type: array
                    maxItems: 100
                    items:
                        "$ref": "#/components/schemas/Deployment"
                    description: Array of deployments, ordered newest first.
                pagination:
                    "$ref": "#/components/schemas/Pagination"
            additionalProperties: false
        V1DeploymentsPromoteDeploymentRequestBody:
            type: object
            required:
                - deploymentId
            properties:
                deploymentId:
                    "$ref": "#/components/schemas/ResourceIdentifier"
            additionalProperties: false
            description: Promote a ready deployment to become the current deployment for its environment.
        V1DeploymentsPromoteDeploymentResponseBody:
            type: object
            required:
                - meta
                - data
            properties:
                meta:
                    "$ref": "#/components/schemas/Meta"
                data:
                    "$ref": "#/components/schemas/EmptyResponse"
            additionalProperties: false
        V1DeploymentsRollbackDeploymentRequestBody:
            type: object
            required:
                - deploymentId
            properties:
                deploymentId:
                    "$ref": "#/components/schemas/ResourceIdentifier"
                    description: |
                        The deployment to roll back TO. Its app's current deployment is used
                        as the rollback source automatically.
            additionalProperties: false
            description: Roll live traffic back to a previous deployment.
        V1DeploymentsRollbackDeploymentResponseBody:
            type: object
            required:
                - meta
                - data
            properties:
                meta:
                    "$ref": "#/components/schemas/Meta"
                data:
                    "$ref": "#/components/schemas/EmptyResponse"
            additionalProperties: false
        V1DeploymentsStartDeploymentRequestBody:
            type: object
            required:
                - deploymentId
            properties:
                deploymentId:
                    "$ref": "#/components/schemas/ResourceIdentifier"
                    description: The stopped deployment to start.
            additionalProperties: false
            description: Start a stopped preview deployment so it serves traffic again.
        V1DeploymentsStartDeploymentResponseBody:
            type: object
            required:
                - meta
                - data
            properties:
                meta:
                    "$ref": "#/components/schemas/Meta"
                data:
                    "$ref": "#/components/schemas/EmptyResponse"
            additionalProperties: false
        V1DeploymentsStopDeploymentRequestBody:
            type: object
            required:
                - deploymentId
            properties:
                deploymentId:
                    "$ref": "#/components/schemas/ResourceIdentifier"
            additionalProperties: false
            description: Stop a running preview deployment to free up resources.
        V1DeploymentsStopDeploymentResponseBody:
            type: object
            required:
                - meta
                - data
            properties:
                meta:
                    "$ref": "#/components/schemas/Meta"
                data:
                    "$ref": "#/components/schemas/EmptyResponse"
            additionalProperties: false
        V1DomainsCreateDomainRequestBody:
            type: object
            required:
                - project
                - app
                - environment
                - domain
            properties:
                project:
                    "$ref": "#/components/schemas/ResourceIdentifier"
                app:
                    "$ref": "#/components/schemas/ResourceIdentifier"
                environment:
                    "$ref": "#/components/schemas/ResourceIdentifier"
                domain:
                    type: string
                    minLength: 4
                    maxLength: 253
                    description: |
                        Fully qualified domain name to attach to the environment, without a scheme, port, or path.
                        Must be unique across your entire workspace: the same name cannot be attached to two environments.

                        The name must sit under a registrable domain: 'api.acme.co.uk' is accepted, the public suffix
                        'co.uk' itself is not. Internationalized names may be sent in Unicode or Punycode form; either
                        way the domain is stored and returned in its canonical form, lowercase ASCII with Unicode labels
                        Punycode encoded, and the DNS records in the response use that form.
                    example: api.acme.com
            additionalProperties: false
        V1DomainsCreateDomainResponseBody:
            type: object
            required:
                - meta
                - data
            properties:
                meta:
                    "$ref": "#/components/schemas/Meta"
                data:
                    "$ref": "#/components/schemas/V1DomainsCreateDomainResponseData"
            additionalProperties: false
        V1DomainsDeleteDomainRequestBody:
            type: object
            required:
                - domain
            properties:
                domain:
                    type: string
                    minLength: 4
                    maxLength: 253
                    description: |
                        Identifies a domain by its Teral ID or by its name. Pass a 'dom_'-prefixed ID, or a fully
                        qualified domain name such as 'api.acme.com' without a scheme, port, or path. You can give an
                        internationalized name in Unicode or Punycode form. Both forms address the same domain.

                        Domain names are unique per workspace, so the name alone addresses the domain. You do not
                        need to supply a project, app, or environment.
                    example: api.acme.com
            additionalProperties: false
        V1DomainsDeleteDomainResponseBody:
            type: object
            required:
                - meta
                - data
            properties:
                meta:
                    "$ref": "#/components/schemas/Meta"
                data:
                    "$ref": "#/components/schemas/EmptyResponse"
            additionalProperties: false
        V1DomainsGetDomainRequestBody:
            type: object
            required:
                - domain
            properties:
                domain:
                    type: string
                    minLength: 4
                    maxLength: 253
                    description: |
                        Identifies a domain by its Teral ID or by its name. Pass a 'dom_'-prefixed ID, or a fully
                        qualified domain name such as 'api.acme.com' without a scheme, port, or path. You can give an
                        internationalized name in Unicode or Punycode form. Both forms address the same domain.

                        Domain names are unique per workspace, so the name alone addresses the domain. You do not
                        need to supply a project, app, or environment.
                    example: api.acme.com
            additionalProperties: false
        V1DomainsGetDomainResponseBody:
            type: object
            required:
                - meta
                - data
            properties:
                meta:
                    "$ref": "#/components/schemas/Meta"
                data:
                    "$ref": "#/components/schemas/Domain"
            additionalProperties: false
        V1DomainsListDomainsRequestBody:
            type: object
            properties:
                project:
                    allOf:
                        - "$ref": "#/components/schemas/ResourceIdentifier"
                    description: |
                        Match domains whose project ID or slug equals this value. This filter does not require
                        an app or environment filter.
                app:
                    allOf:
                        - "$ref": "#/components/schemas/ResourceIdentifier"
                    description: |
                        Match domains whose app ID or slug equals this value. This filter does not require a
                        project or environment filter.
                environment:
                    allOf:
                        - "$ref": "#/components/schemas/ResourceIdentifier"
                    description: |
                        Match domains whose environment ID or slug equals this value. This filter does not require
                        a project or app filter.
                limit:
                    type: integer
                    description: |
                        The maximum number of domains one response contains.
                        A small limit makes the response smaller, but makes more requests necessary.
                    default: 100
                    minimum: 1
                    maximum: 100
                cursor:
                    type: string
                    description: |
                        The pagination cursor from the response that came before.
                        Send it to get the next page when that response has `hasMore: true`.
                    example: dom_1234abcd
                search:
                    type: string
                    maxLength: 256
                    description: Free-form text to filter domains. Returns domains whose ID or name contains the search string. Matching is case-insensitive.
                    example: acme.com
            additionalProperties: false
            description: |
                Filter domains within a workspace. All filters are optional and combine with AND. Each resource
                filter matches its ID or slug directly, even when its parent filters are omitted. A missing
                resource or a resource that does not match the other filters produces an empty list.
        V1DomainsListDomainsResponseBody:
            type: object
            required:
                - meta
                - data
                - pagination
            properties:
                meta:
                    "$ref": "#/components/schemas/Meta"
                data:
                    type: array
                    maxItems: 100
                    items:
                        "$ref": "#/components/schemas/Domain"
                    description: |
                        Domains that match every request filter and that you have permission to read, sorted by ID.
                        The array is empty when no readable domains match, including when a filtered resource
                        is missing or mismatched.
                pagination:
                    "$ref": "#/components/schemas/Pagination"
                    description: |
                        Pagination over permitted domains. When more permitted domains exist, `cursor` identifies
                        the first permitted domain after this page. A domain the credential cannot read is never
                        returned as the cursor.
            additionalProperties: false
        V1DomainsVerifyDomainRequestBody:
            type: object
            required:
                - domain
            properties:
                domain:
                    type: string
                    minLength: 4
                    maxLength: 253
                    description: |
                        Identifies a domain by its name or by its ID. Send the fully qualified domain name, such as
                        'api.acme.com', without a scheme, port, or path, or send the domain ID that
                        domains.createDomain returns. You can send an internationalized name in Unicode or in
                        Punycode form. Both forms address the same domain.
                    example: api.acme.com
            additionalProperties: false
        V1DomainsVerifyDomainResponseBody:
            type: object
            required:
                - meta
                - data
            properties:
                meta:
                    "$ref": "#/components/schemas/Meta"
                data:
                    "$ref": "#/components/schemas/EmptyResponse"
            additionalProperties: false
        V1EnvironmentsGetEnvironmentRequestBody:
            type: object
            required:
                - project
                - app
                - environment
            properties:
                project:
                    "$ref": "#/components/schemas/ResourceIdentifier"
                app:
                    "$ref": "#/components/schemas/ResourceIdentifier"
                environment:
                    "$ref": "#/components/schemas/ResourceIdentifier"
            additionalProperties: false
        V1EnvironmentsGetEnvironmentResponseBody:
            type: object
            required:
                - meta
                - data
            properties:
                meta:
                    "$ref": "#/components/schemas/Meta"
                data:
                    "$ref": "#/components/schemas/Environment"
            additionalProperties: false
        V1EnvironmentsListEnvironmentVariablesRequestBody:
            type: object
            required:
                - project
                - app
                - environment
            properties:
                project:
                    "$ref": "#/components/schemas/ResourceIdentifier"
                app:
                    "$ref": "#/components/schemas/ResourceIdentifier"
                environment:
                    "$ref": "#/components/schemas/ResourceIdentifier"
                limit:
                    type: integer
                    minimum: 1
                    maximum: 100
                    default: 100
                    description: Maximum number of variables to return per request.
                cursor:
                    type: string
                    minLength: 1
                    maxLength: 1024
                    description: |
                        Pagination cursor from a previous response to fetch the next page.
                        Use when `hasMore: true` in the previous response.
            additionalProperties: false
        V1EnvironmentsListEnvironmentVariablesResponseBody:
            type: object
            required:
                - meta
                - data
                - pagination
            properties:
                meta:
                    "$ref": "#/components/schemas/Meta"
                data:
                    type: array
                    items:
                        "$ref": "#/components/schemas/EnvironmentVariable"
                pagination:
                    "$ref": "#/components/schemas/Pagination"
            additionalProperties: false
        V1EnvironmentsListEnvironmentsRequestBody:
            type: object
            required:
                - project
                - app
            properties:
                project:
                    "$ref": "#/components/schemas/ResourceIdentifier"
                app:
                    "$ref": "#/components/schemas/ResourceIdentifier"
            additionalProperties: false
        V1EnvironmentsListEnvironmentsResponseBody:
            type: object
            required:
                - meta
                - data
            properties:
                meta:
                    "$ref": "#/components/schemas/Meta"
                data:
                    type: array
                    items:
                        "$ref": "#/components/schemas/Environment"
                    description: Array of environments in the app, ordered by environment id.
            additionalProperties: false
        V1EnvironmentsRemoveEnvironmentVariablesRequestBody:
            type: object
            required:
                - project
                - app
                - environment
                - variables
            properties:
                project:
                    "$ref": "#/components/schemas/ResourceIdentifier"
                app:
                    "$ref": "#/components/schemas/ResourceIdentifier"
                environment:
                    "$ref": "#/components/schemas/ResourceIdentifier"
                variables:
                    type: array
                    minItems: 1
                    maxItems: 50
                    items:
                        type: string
                        minLength: 1
                        maxLength: 256
                        pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
                        description: |
                            The name of a variable to remove. Must be a POSIX shell name: letters,
                            digits, and underscores only, and must not start with a digit.
                        example: LOG_LEVEL
                    description: |
                        The names of the variables to remove. Keys that exist are deleted; keys
                        that are not present are ignored, since their absence already matches the
                        requested state.

                        Duplicate keys collapse to a single removal. The whole operation is atomic:
                        if any part fails the environment is left unchanged. Limited to 50
                        variables per request.
            additionalProperties: false
        V1EnvironmentsRemoveEnvironmentVariablesResponseBody:
            type: object
            required:
                - meta
                - data
            properties:
                meta:
                    "$ref": "#/components/schemas/Meta"
                data:
                    "$ref": "#/components/schemas/EmptyResponse"
            additionalProperties: false
        V1EnvironmentsSetEnvironmentVariablesRequestBody:
            type: object
            required:
                - project
                - app
                - environment
                - variables
            properties:
                project:
                    "$ref": "#/components/schemas/ResourceIdentifier"
                app:
                    "$ref": "#/components/schemas/ResourceIdentifier"
                environment:
                    "$ref": "#/components/schemas/ResourceIdentifier"
                variables:
                    type: array
                    maxItems: 50
                    items:
                        "$ref": "#/components/schemas/EnvironmentVariableInput"
                    description: |
                        The variables to upsert. Each entry is created if its key is new or fully
                        overwritten if the key already exists. Existing variables whose keys are
                        not in this list are left untouched, unless `prune` is true.

                        Each entry is written exactly as sent, never merged with the current
                        state. Only `value` is required; omitted optional fields (`kind`,
                        `description`) fall back to their defaults rather than any previous value,
                        so overwriting a variable without a `description` clears it.

                        Each key may appear at most once; a duplicate key is rejected with a 400.
                        The whole operation is atomic: if any part fails the environment is left
                        unchanged. All values are encrypted at rest. Limited to 50 variables per
                        request.
                prune:
                    type: boolean
                    default: false
                    description: |-
                        Optional. Defaults to false. When false, the variables above are upserted
                        and any existing variable not in the list is kept. When true, this becomes
                        a full replace: after upserting, every variable not in the list is deleted.
                        Combined with an empty `variables` list, `prune: true` resets the entire
                        environment by deleting every variable.
            additionalProperties: false
        V1EnvironmentsSetEnvironmentVariablesResponseBody:
            type: object
            required:
                - meta
                - data
            properties:
                meta:
                    "$ref": "#/components/schemas/Meta"
                data:
                    "$ref": "#/components/schemas/EmptyResponse"
            additionalProperties: false
        V1EnvironmentsUpdateSettingsRequestBody:
            type: object
            required:
                - project
                - app
                - environment
            properties:
                project:
                    "$ref": "#/components/schemas/ResourceIdentifier"
                app:
                    "$ref": "#/components/schemas/ResourceIdentifier"
                environment:
                    "$ref": "#/components/schemas/ResourceIdentifier"
                dockerfile:
                    type:
                        - string
                        - "null"
                    minLength: 1
                    maxLength: 500
                    description: |
                        Path to the Dockerfile used for builds.
                        Omit to leave unchanged; set null to clear and fall back to Railpack.
                    example: ./Dockerfile
                rootDirectory:
                    type: string
                    minLength: 1
                    maxLength: 500
                    description: |
                        The directory your app lives in. Teral builds from here.
                        Use "." for the repository root, or set a subdirectory when your app
                        is nested (e.g., services/api). Omit to leave unchanged.
                    example: .
                buildCommand:
                    type:
                        - string
                        - "null"
                    minLength: 1
                    maxLength: 1000
                    description: |
                        Overrides the build command auto-detected by Railpack.
                        Omit to leave unchanged; set null to clear and fall back to auto-detection.
                    example: pnpm --filter api build
                watchPaths:
                    type: array
                    maxItems: 10
                    items:
                        type: string
                        maxLength: 500
                    description: |
                        Glob patterns that trigger auto-deploys when matching files change.
                        Do not start a pattern with "/" or "./".
                        Use "src/**" for everything under a directory and "**/*.go" for a file type.
                        A pattern with no wildcard matches only that exact file, so "src" is not "src/**".
                        Omit to leave unchanged. Invalid patterns are rejected with a 400.
                autoDeploy:
                    type: boolean
                    description: |
                        Whether pushes auto-deploy.
                        Omit to leave unchanged.
                    example: true
                port:
                    type: integer
                    minimum: 1
                    maximum: 65535
                    description: |
                        Container port the app listens on.
                        Omit to leave unchanged.
                    example: 8080
                vCpus:
                    type: number
                    format: double
                    minimum: 0.25
                    multipleOf: 0.25
                    description: |
                        CPU allocation in vCPUs. Minimum 0.25 (1/4 vCPU), in steps of 0.25.
                        The upper bound is your workspace's per-instance quota; exceeding it returns 400.
                        Omit to leave unchanged.
                    example: 1
                memoryMib:
                    type: integer
                    minimum: 256
                    multipleOf: 256
                    description: |
                        Memory allocation in MiB. Minimum 256, in steps of 256.
                        The upper bound is your workspace's per-instance quota; exceeding it returns 400.
                        Omit to leave unchanged.
                    example: 512
                storageMib:
                    type: integer
                    minimum: 0
                    multipleOf: 512
                    description: |
                        Ephemeral storage allocation in MiB, in steps of 512 (0 for none).
                        The upper bound is your workspace's per-instance quota; exceeding it returns 400.
                        Omit to leave unchanged.
                    example: 1024
                command:
                    type: array
                    maxItems: 10
                    items:
                        type: string
                        maxLength: 4096
                    description: |
                        Override container entrypoint command.
                        Omit to leave unchanged.
                healthcheck:
                    description: |
                        HTTP healthcheck configuration.
                        Omit to leave unchanged; set null to remove.
                    anyOf:
                        - "$ref": "#/components/schemas/EnvironmentHealthcheck"
                        - type: "null"
                shutdownSignal:
                    "$ref": "#/components/schemas/EnvironmentShutdownSignal"
                    description: |
                        Signal sent to the container on shutdown.
                        Omit to leave unchanged.
                upstreamProtocol:
                    "$ref": "#/components/schemas/EnvironmentUpstreamProtocol"
                    description: |
                        Protocol used to reach the upstream container.
                        Omit to leave unchanged.
                openapiSpecPath:
                    type:
                        - string
                        - "null"
                    minLength: 1
                    maxLength: 512
                    pattern: '^(/[\w\-]+)+(\.[\w]+)?$'
                    description: |
                        Path to the OpenAPI spec file within the build. Must start with a slash.
                        Omit to leave unchanged; set null to clear.
                    example: /openapi.yaml
                regions:
                    type: array
                    minItems: 1
                    maxItems: 5
                    items:
                        "$ref": "#/components/schemas/EnvironmentRegion"
                    description: |
                        Desired set of regions with per-region replica bounds.
                        Omit to leave regions unchanged; when present, this replaces the full set
                        (regions absent from the list are removed). At least one region is required;
                        an empty list is rejected because an environment cannot have zero regions.
            additionalProperties: false
        V1EnvironmentsUpdateSettingsResponseBody:
            type: object
            required:
                - meta
                - data
            properties:
                meta:
                    "$ref": "#/components/schemas/Meta"
                data:
                    "$ref": "#/components/schemas/EmptyResponse"
            additionalProperties: false
        V1GatewayListPoliciesRequestBody:
            type: object
            required:
                - project
                - app
                - environment
            properties:
                project:
                    "$ref": "#/components/schemas/ResourceIdentifier"
                app:
                    "$ref": "#/components/schemas/ResourceIdentifier"
                environment:
                    "$ref": "#/components/schemas/ResourceIdentifier"
            additionalProperties: false
        V1GatewayListPoliciesResponseBody:
            type: object
            required:
                - meta
                - data
            properties:
                meta:
                    "$ref": "#/components/schemas/Meta"
                data:
                    "$ref": "#/components/schemas/V1GatewayListPoliciesResponseData"
            additionalProperties: false
        V1GatewaySetPoliciesRequestBody:
            type: object
            required:
                - project
                - app
                - environment
                - policies
            properties:
                project:
                    "$ref": "#/components/schemas/ResourceIdentifier"
                app:
                    "$ref": "#/components/schemas/ResourceIdentifier"
                environment:
                    "$ref": "#/components/schemas/ResourceIdentifier"
                policies:
                    type: array
                    maxItems: 50
                    items:
                        "$ref": "#/components/schemas/Policy"
                    description: |-
                        The environment's complete policy list, in evaluation order. Every call
                        replaces all stored policies with exactly this list; an empty list
                        removes every policy. The operation is atomic: if any policy is
                        invalid, nothing is written. An environment can hold at most 50
                        policies.
            additionalProperties: false
        V1GatewaySetPoliciesResponseBody:
            type: object
            required:
                - meta
                - data
            properties:
                meta:
                    "$ref": "#/components/schemas/Meta"
                data:
                    "$ref": "#/components/schemas/EmptyResponse"
            additionalProperties: false
        V1GatewayUpdatePolicyRequestBody:
            type: object
            required:
                - project
                - app
                - environment
                - policyId
            properties:
                project:
                    "$ref": "#/components/schemas/ResourceIdentifier"
                app:
                    "$ref": "#/components/schemas/ResourceIdentifier"
                environment:
                    "$ref": "#/components/schemas/ResourceIdentifier"
                policyId:
                    type: string
                    minLength: 1
                    maxLength: 512
                    description: |-
                        Id of the policy to update, as returned by `gateway.listPolicies`.
                        Ids are regenerated whenever `gateway.setPolicies` replaces the list,
                        so list the policies first if you are unsure the id is current.
                    example: pol_9d2Fk1LmQ
                name:
                    type: string
                    minLength: 1
                    maxLength: 256
                    description: |-
                        New human-readable name. Omit to keep the current name.
                enabled:
                    type: boolean
                    description: |-
                        Enable or disable the policy. Disabled policies are stored but skipped
                        during evaluation. Omit to keep the current setting.
                match:
                    type:
                        - array
                        - "null"
                    maxItems: 10
                    items:
                        "$ref": "#/components/schemas/MatchExpr"
                    description: |-
                        Replaces all match expressions. Set null to remove them so the policy
                        applies to every request. Omit to keep the current expressions.
                firewall:
                    "$ref": "#/components/schemas/FirewallPolicy"
                logging:
                    "$ref": "#/components/schemas/LoggingPolicy"
            additionalProperties: false
            description: |-
                Partial update of a single policy. Omitted fields keep their stored
                values; at least one updatable field must be provided. Providing one of
                `firewall` or `logging` replaces the
                policy's rule entirely, including switching its type; at most one may be
                set.
        V1GatewayUpdatePolicyResponseBody:
            type: object
            required:
                - meta
                - data
            properties:
                meta:
                    "$ref": "#/components/schemas/Meta"
                data:
                    "$ref": "#/components/schemas/EmptyResponse"
            additionalProperties: false
        V1GithubInstallAppResponseBody:
            type: object
            required:
                - meta
                - data
            properties:
                meta:
                    $ref: "#/components/schemas/Meta"
                data:
                    $ref: "#/components/schemas/V1GithubInstallAppResponseData"
            additionalProperties: false
        V1LivenessResponseBody:
            type: object
            required:
                - meta
                - data
            properties:
                meta:
                    "$ref": "#/components/schemas/Meta"
                data:
                    "$ref": "#/components/schemas/V1LivenessResponseData"
        V1LogsGetBuildLogsRequestBody:
            type: object
            required:
                - deploymentId
            properties:
                deploymentId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    example: d_1234abcd
                afterSeq:
                    type: integer
                    format: int64
                    minimum: 0
                    description: Only return lines with a sequence number greater than this. Omit to start from the beginning.
                limit:
                    type: integer
                    minimum: 1
                    maximum: 5000
                    default: 1000
            additionalProperties: false
        V1LogsGetBuildLogsResponseBody:
            type: object
            required:
                - meta
                - data
            properties:
                meta:
                    "$ref": "#/components/schemas/Meta"
                data:
                    "$ref": "#/components/schemas/V1LogsGetBuildLogsResponseData"
            additionalProperties: false
        V1LogsQueryRuntimeLogsRequestBody:
            type: object
            required:
                - project
            properties:
                project:
                    "$ref": "#/components/schemas/ResourceIdentifier"
                app:
                    "$ref": "#/components/schemas/ResourceIdentifier"
                environment:
                    "$ref": "#/components/schemas/ResourceIdentifier"
                deploymentId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    description: Only return logs of this deployment.
                    example: d_1234abcd
                since:
                    type: integer
                    format: int64
                    minimum: 0
                    description: Only return logs at or after this Unix millisecond timestamp. Defaults to one hour ago.
                until:
                    type: integer
                    format: int64
                    minimum: 0
                    description: Only return logs before this Unix millisecond timestamp.
                severity:
                    type: array
                    maxItems: 8
                    items:
                        type: string
                        enum:
                            - DEBUG
                            - INFO
                            - WARN
                            - ERROR
                            - FATAL
                    description: Only return logs with one of these severities.
                query:
                    type: string
                    maxLength: 512
                    description: Case-insensitive substring that must appear in the message or attributes.
                order:
                    type: string
                    enum:
                        - asc
                        - desc
                    default: desc
                limit:
                    type: integer
                    minimum: 1
                    maximum: 1000
                    default: 100
                cursor:
                    type: string
                    minLength: 1
                    maxLength: 1024
            additionalProperties: false
        V1LogsQueryRuntimeLogsResponseBody:
            type: object
            required:
