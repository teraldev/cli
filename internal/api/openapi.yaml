                sessionId:
                    type: string
                    example: clis_4fQm9XkV2u8s
                expiresAt:
                    type: integer
                    format: int64
                    description: Unix milliseconds when the session expires unless it is used. Every use extends it.
                workspace:
                    "$ref": "#/components/schemas/WorkspaceSummary"
                user:
                    type: object
                    required:
                        - id
                        - name
                    properties:
                        id:
                            type: string
                        name:
                            type: string
                        email:
                            type: string
                            x-go-type-skip-optional-pointer: true
                    additionalProperties: false
            additionalProperties: false
            description: Credentials of a new CLI session.
        V1CliRevokeSessionResponseData:
            type: object
            required:
                - sessionId
            properties:
                sessionId:
                    type: string
                    example: clis_4fQm9XkV2u8s
            additionalProperties: false
        V1CliStartDeviceAuthorizationResponseData:
            type: object
            required:
                - deviceCode
                - userCode
                - verificationUri
                - verificationUriComplete
                - expiresIn
                - interval
            properties:
                deviceCode:
