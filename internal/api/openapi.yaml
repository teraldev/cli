                status:
                    type: string
                    enum:
                        - pending
                        - approved
                        - denied
                        - expired
                clientName:
                    type: string
                    example: teral-cli/1.0.0
                deviceName:
                    type: string
                    example: fynns-macbook
                deviceOs:
                    type: string
                    example: darwin/arm64
                requestIp:
                    type: string
                    description: IP address the CLI started the request from.
                    example: 203.0.113.7
                createdAt:
                    type: integer
                    format: int64
                    description: Unix milliseconds when the CLI started the request.
                expiresAt:
                    type: integer
                    format: int64
                    description: Unix milliseconds when the request expires.
            additionalProperties: false
        CliSession:
            type: object
            required:
                - id
                - userId
                - userName
                - clientName
                - deviceName
                - deviceOs
                - createdAt
                - lastUsedAt
                - expiresAt
                - current
            properties:
                id:
                    type: string
                    example: clis_4fQm9XkV2u8s
                userId:
                    type: string
                userName:
                    type: string
                userEmail:
                    type: string
                    x-go-type-skip-optional-pointer: true
                clientName:
                    type: string
                    example: teral-cli/1.0.0
                deviceName:
                    type: string
                    example: fynns-macbook
                deviceOs:
                    type: string
                    example: darwin/arm64
                createdIp:
                    type: string
                    x-go-type-skip-optional-pointer: true
                lastUsedIp:
                    type: string
                    x-go-type-skip-optional-pointer: true
                createdAt:
                    type: integer
                    format: int64
                lastUsedAt:
                    type: integer
                    format: int64
                    description: Unix milliseconds of the last request, or 0 if never used.
                expiresAt:
                    type: integer
                    format: int64
                current:
                    type: boolean
                    description: True for the session that made this request.
            additionalProperties: false
        V1CliPollDeviceAuthorizationResponseData:
            type: object
            required:
                - status
            properties:
                status:
                    type: string
                    enum:
                        - pending
                        - slow_down
                        - approved
                        - denied
                        - expired
                    description: |
                        - `pending`: the user has not decided yet. Poll again after `interval` seconds.
                        - `slow_down`: the client polled too fast. Poll again after the new `interval`.
                        - `approved`: the user approved. `session` holds the credentials.
                        - `denied`: the user denied the request. Stop polling.
                        - `expired`: the codes expired or the credentials were already collected. Start over.
                interval:
                    type: integer
                    description: Seconds to wait before the next poll. Present for `pending` and `slow_down`.
                    example: 5
                session:
                    "$ref": "#/components/schemas/CliSessionCredentials"
            additionalProperties: false
        CliSessionCredentials:
            type: object
            required:
                - token
                - sessionId
                - expiresAt
