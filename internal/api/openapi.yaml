                required: true
            responses:
                "202":
                    content:
                        application/json:
                            examples:
                                success:
                                    description: App deletion was successfully enqueued
                                    summary: Deletion enqueued
                                    value:
                                        data: {}
                                        meta:
                                            requestId: req_1234abcd
                            schema:
                                $ref: '#/components/schemas/V1AppsDeleteAppResponseBody'
                    description: |
