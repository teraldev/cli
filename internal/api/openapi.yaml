                    type: string
                    enum:
                        - approved
            additionalProperties: false
        V1CliDenyDeviceAuthorizationResponseData:
            type: object
            required:
                - status
            properties:
                status:
                    type: string
                    enum:
                        - denied
            additionalProperties: false
        V1CliGetDeviceAuthorizationResponseData:
