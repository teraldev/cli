                                                  verified: false
                                              domain: api.acme.com
                                              environmentId: env_1234abcd
                                              id: dom_1234abcd
                                              projectId: proj_1234abcd
                                              status: verified
                                              updatedAt: 1704067260000
                                            - appId: app_1234abcd
